services:
  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-agent-outbound
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "127.0.0.1:8766:8766"
    env_file:
      - .env
    volumes:
      - voice_agent_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  voice_agent_data:
